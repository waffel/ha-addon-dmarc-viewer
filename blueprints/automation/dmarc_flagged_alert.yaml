blueprint:
  name: DMARC flagged report alert
  description: Runs the chosen action when the number of flagged DMARC reports increases.
  domain: automation
  source_url: https://github.com/waffel/ha-addon-dmarc-viewer/blob/main/blueprints/automation/dmarc_flagged_alert.yaml
  input:
    alert_action:
      name: Action
      description: What to do when a DMARC report is flagged, for example send a notification.
      selector:
        action: {}
      default:
        - action: persistent_notification.create
          data:
            title: DMARC problem
            message: A DMARC report is flagged (SPF or DKIM failed). See the DMARC card for details.

mode: single

triggers:
  - trigger: state
    entity_id: sensor.dmarc_reports_flagged

conditions:
  - condition: template
    value_template: >
      {{ trigger.from_state is not none
         and trigger.from_state.state | int(0) < trigger.to_state.state | int(0) }}

actions: !input alert_action
