# Home Assistant package: DMARC report sensors + alert.
# Place at /config/packages/dmarc.yaml (needs `homeassistant: packages: !include_dir_named packages` in configuration.yaml).
# The add-on hostname is shown on the add-on's info page; for a local add-on with slug
# "dmarc_viewer" it is normally "local-dmarc-viewer".
rest:
  - resource: http://local-dmarc-viewer:8080/summary
    scan_interval: 1800
    sensor:
      - name: "DMARC reports total"
        unique_id: dmarc_reports_total
        value_template: "{{ value_json.dmarc.reports }}"
        state_class: measurement
      - name: "DMARC SPF passed"
        unique_id: dmarc_spf_passed
        value_template: "{{ value_json.dmarc.spf_policy_results.get('pass', 0) }}"
        state_class: measurement
      - name: "DMARC DKIM passed"
        unique_id: dmarc_dkim_passed
        value_template: "{{ value_json.dmarc.dkim_policy_results.get('pass', 0) }}"
        state_class: measurement
  - resource: http://local-dmarc-viewer:8080/dmarc-reports
    scan_interval: 1800
    sensor:
      - name: "DMARC reports flagged"
        unique_id: dmarc_reports_flagged
        value_template: "{{ value_json | selectattr('flagged') | list | length }}"
        state_class: measurement

automation:
  - alias: "DMARC: new flagged report"
    id: dmarc_new_flagged_report
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.dmarc_reports_flagged
    condition:
      - condition: template
        value_template: >
          {{ trigger.from_state is not none
             and trigger.from_state.state | int(0) < trigger.to_state.state | int(0) }}
    action:
      - service: persistent_notification.create
        data:
          title: "DMARC-Problem"
          message: >
            Ein DMARC-Bericht ist auffällig (SPF oder DKIM fehlgeschlagen).
            Auffällige Berichte insgesamt: {{ states('sensor.dmarc_reports_flagged') }}.
      - service: notify.notify
        data:
          title: "DMARC-Problem"
          message: "Auffälliger DMARC-Bericht für deine Domains. Details im Dashboard."
