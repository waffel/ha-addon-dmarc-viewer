# English card. Paste into: Dashboard -> Edit -> Add card -> Manual.
# Entity names come from the add-on (option "language"), so they are not repeated here.
type: vertical-stack
cards:
  - type: entities
    title: DMARC reports
    entities:
      - sensor.dmarc_reports_total
      - sensor.dmarc_spf_passed
      - sensor.dmarc_dkim_passed
      - sensor.dmarc_reports_flagged
  - type: history-graph
    title: History, last 30 days
    hours_to_show: 720
    entities:
      - sensor.dmarc_spf_passed
      - sensor.dmarc_dkim_passed
      - sensor.dmarc_reports_flagged
