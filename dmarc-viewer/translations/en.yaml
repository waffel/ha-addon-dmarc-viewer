configuration:
  imap_host:
    name: IMAP host
    description: Host name of the IMAP server of the mailbox that receives the DMARC reports (TLS, port 993).
  imap_user:
    name: IMAP user
    description: Login name of the mailbox.
  imap_password:
    name: IMAP password
    description: Password of the mailbox.
  imap_folder:
    name: IMAP folder
    description: Folder that contains the DMARC report mails.
  check_interval_hours:
    name: Check interval (hours)
    description: How often the folder is checked for new reports.
  web_ui_password:
    name: Web UI password
    description: Optional. Protects the viewer web page (user "dmarc") once you enable its port in the Network tab. Keep empty while the port is off.
  language:
    name: Language
    description: Language of the sensor names in Home Assistant (en or de).
