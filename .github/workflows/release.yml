name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be a plain version on main
        run: |
          printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "Tag $GITHUB_REF_NAME is not of the form vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "Tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Tag must match the add-on version
        run: |
          version="$(sed -n 's/^version: "\(.*\)"$/\1/p' dmarc-viewer/config.yaml)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version in config.yaml"; exit 1; }
      - name: Tests
        run: sh tests/run.sh
      - name: Extract release notes from the changelog
        run: sh scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
