name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: docker run --rm -v "$PWD":/data cytopia/yamllint:1 -c .yamllint.yaml .
      - name: shellcheck
        run: docker run --rm -v "$PWD":/mnt koalaman/shellcheck:v0.10.0 dmarc-viewer/run.sh
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < dmarc-viewer/Dockerfile
