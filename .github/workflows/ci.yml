name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "chore/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: docker run --rm -v "$PWD":/data cytopia/yamllint:1 -c .yamllint.yaml .
      - name: shellcheck
        run: >-
          docker run --rm -v "$PWD":/mnt koalaman/shellcheck:v0.10.0
          dmarc-viewer/run.sh dmarc-viewer/push-states.sh tests/run-tests.sh scripts/changelog-section.sh
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < dmarc-viewer/Dockerfile

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: docker run --rm -v "$PWD":/repo:ro alpine:3.21 sh /repo/tests/run-tests.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the add-on image from the pinned upstream commit
        run: docker build dmarc-viewer
